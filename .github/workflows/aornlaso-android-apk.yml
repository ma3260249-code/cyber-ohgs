name: AORNLASO Android APK

on:
  push:
    branches: [integrate-cyber-ohgs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Web
        working-directory: AORNLASO_0.1/apps/web
        run: |
          npm ci
          npm run build

      - name: Sync Android
        working-directory: AORNLASO_0.1/apps/web
        run: npx cap sync android

      - name: Build APK
        working-directory: AORNLASO_0.1/apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AORNLASO-debug-APK
          path: AORNLASO_0.1/apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
