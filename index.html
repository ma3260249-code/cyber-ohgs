<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cyber OHGS Agent v10.0 - Gideon Core</title>
                <style>
                        body { background: #030712; color: #38bdf8; font-family: monospace; padding: 10px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                                .box { width: 100%; max-width: 650px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; }
                                        .console { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; text-align: right; }
                                                .row { display: flex; gap: 8px; }
                                                        textarea { flex: 1; padding: 10px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 6px; font-size: 13px; height: 40px; resize: none; direction: ltr; text-align: left; }
                                                                button { padding: 0 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
                                                                        .ai { color: #c084fc; font-weight: bold; }
                                                                                .user { color: #38bdf8; font-weight: bold; }
                                                                                        .ok { color: #4ade80; }
                                                                                                .err { color: #f43f5e; }
                                                                                                        .info { color: #facc15; }
                                                                                                            </style>
                                                                                                            </head>
                                                                                                            <body>
                                                                                                                <div class="box">
                                                                                                                        <div style="margin-bottom: 8px; font-size: 13px; color: #c084fc;"><b>Cyber OHGS - Gideon Core v10.0</b></div>
                                                                                                                                <div id="log" class="console"><span class='ai'>[ Gideon ]</span> أهلاً يا محمد، تم تفعيل نواة الذاكرة السياقية v10.0 بنجاح. أسمعك...
                                                                                                                                --------------------------------------------------</div>
                                                                                                                                        <div class="row">
                                                                                                                                                    <textarea id="txt" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();runGideon();}" autofocus></textarea>
                                                                                                                                                                <button onclick="runGideon()">إرسال</button>
                                                                                                                                                                        </div>
                                                                                                                                                                            </div>

                                                                                                                                                                                <script>
                                                                                                                                                                                        // ذاكرة لتخزين سياق الحوار الأخير
                                                                                                                                                                                                let memory = [];

                                                                                                                                                                                                        const kb = {
                                                                                                                                                                                                                    "google.com": "محرك البحث والخدمات السحابية (تأسس 1998)",
                                                                                                                                                                                                                                "facebook.com": "منصة التواصل الاجتماعي الكبرى (تأسست 2004)",
                                                                                                                                                                                                                                            "instagram.com": "منصة الصور والفيديوهات تابعة لـ Meta (تأسست 2010)",
                                                                                                                                                                                                                                                        "github.com": "منصة استضافة وتطوير الأكواد (تأسست 2008)"
                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                        async function runGideon() {
                                                                                                                                                                                                                                                                                    let t = document.getElementById('txt');
                                                                                                                                                                                                                                                                                                let l = document.getElementById('log');
                                                                                                                                                                                                                                                                                                            let q = t.value.trim();
                                                                                                                                                                                                                                                                                                                        if (!q) return;

                                                                                                                                                                                                                                                                                                                                    // حفظ مدخلات المستخدم في الذاكرة القصيرة
                                                                                                                                                                                                                                                                                                                                                memory.push({ role: "user", text: q });
                                                                                                                                                                                                                                                                                                                                                            if (memory.length > 10) memory.shift(); // الحفاظ على آخر 10 رسائل فقط كذاكرة نشطة

                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `\n<span class='user'>[محمد] >> ${q}</span>\n`;
                                                                                                                                                                                                                                                                                                                                                                                    t.value = "";
                                                                                                                                                                                                                                                                                                                                                                                                l.scrollTop = l.scrollHeight;

                                                                                                                                                                                                                                                                                                                                                                                                            let lower = q.toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                                        let isLink = lower.includes('http') || lower.includes('.com') || lower.includes('.org') || lower.includes('.net') || lower.includes('.jo');

                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!isLink) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    let ans = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let lastUserTopic = memory.length > 1 ? memory[memory.length - 2].text : "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // معالجة ذكية وسياقية تفهم كلام محمد
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (lower.includes('شلونك') || lower.includes('كيفك') || lower.includes('اخبارك') || lower.includes('كيف حالك')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ans = "أنظمتي تعمل بكفاءة تامة يا محمد، طمني عنك أنت وكيف سير العمل معك؟";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else if (lower.includes('مرحبا') || lower.includes('هلا') || lower.includes('السلام')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ans = "أهلاً بك يا محمد. النواة جاهزة لتلقي التعليمات.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else if (lower.includes('ذاكرة') || lower.includes('تتذكر')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ans = `نعم يا محمد، أنا أتتبع السياق الحالي. آخر ما تحدثنا عنه كان: "${lastUserTopic}".`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                else if (lower.includes('اسمك') || lower.includes('من انت')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ans = "أنا نظام التشغيل والذكاء الاصطناعي الخاص بك ضمن مشروع Cyber OHGS (نسخة شبيهة بـ Gideon).";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // الرد السياقي الذي يستحضر أجزاء من الحوار السابق
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ans = `تم تسجيل المدخلات ضمن الذاكرة النشطة بنجاح. بخصوص "${q}", هل ترغب بأن نربط هذه الجزئيّة بالخطوة البرمجية القادمة؟`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // حفظ رد النظام في الذاكرة
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            memory.push({ role: "ai", text: ans });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.innerHTML += `<span class='ai'>[Gideon]</span> ${ans}\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // مسار الفحص التقني للنطاقات
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.innerHTML += `<span class='ai'>[Gideon Core]</span> جاري فحص النطاق وتحليل البيانات...\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await new Promise(r => setTimeout(r, 300));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let m = q.match(/(?:https?:\/\/)?(?:www\.)?([a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+)/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let domain = m ? m[1] : "google.com";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let info = kb[domain] || "منصة رقمية نشطة";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let res = `https://dns.google/resolve?name=${domain}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let data = await (await fetch(res)).json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (data.Answer && data.Answer.length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let ip = data.Answer[0].data;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let report = `[تقرير فحص النطاق]\n - الهدف: ${domain}\n - المعرّف: ${info}\n - عنوان IP: ${ip}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class='ok'>${report}</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class='err'>[!] لم يتم العثور على سجلات نشطة للنطاق.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class='err'>[!] خطأ في الاتصال بشبكة الاستطلاع.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
