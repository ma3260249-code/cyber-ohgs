<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cyber OHGS Core</title>
                <style>
                        body { background: #030712; color: #38bdf8; font-family: monospace; padding: 10px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                                .box { width: 100%; max-width: 650px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; }
                                        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
                                                .title { font-size: 13px; color: #c084fc; font-weight: bold; }
                                                        .reset-btn { background: #1e293b; color: #f43f5e; border: 1px solid #334155; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-family: monospace; }
                                                                .reset-btn:hover { background: #334155; }
                                                                        .console { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; text-align: right; }
                                                                                .row { display: flex; gap: 8px; }
                                                                                        textarea { flex: 1; padding: 10px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 6px; font-size: 13px; height: 40px; resize: none; direction: ltr; text-align: left; }
                                                                                                button.send { padding: 0 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
                                                                                                        .ai { color: #c084fc; font-weight: bold; }
                                                                                                                .user { color: #38bdf8; font-weight: bold; }
                                                                                                                        .ok { color: #4ade80; }
                                                                                                                            </style>
                                                                                                                            </head>
                                                                                                                            <body>
                                                                                                                                <div class="box">
                                                                                                                                        <div class="header">
                                                                                                                                                    <div class="title"><b>Cyber OHGS Core</b></div>
                                                                                                                                                                <button class="reset-btn" onclick="resetMemory()">مسح الذاكرة</button>
                                                                                                                                                                        </div>
                                                                                                                                                                                <div id="log" class="console"><span class='ai'>[Cyber OHGS]</span> النظام جاهز. أسمعك...
                                                                                                                                                                                --------------------------------------------------</div>
                                                                                                                                                                                        <div class="row">
                                                                                                                                                                                                    <textarea id="txt" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();runCyber();}" autofocus></textarea>
                                                                                                                                                                                                                <button class="send" onclick="runCyber()">إرسال</button>
                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                        let memory = JSON.parse(localStorage.getItem('cyber_memory')) || [];
                                                                                                                                                                                                                                                let isProcessing = false;

                                                                                                                                                                                                                                                        function renderHistory() {
                                                                                                                                                                                                                                                                    const l = document.getElementById("log");
                                                                                                                                                                                                                                                                                if (memory.length > 0) {
                                                                                                                                                                                                                                                                                                let html = "<span class='ai'>[Cyber OHGS]</span> استرجاع الذاكرة السابقة...\n--------------------------------------------------\n";
                                                                                                                                                                                                                                                                                                                memory.forEach(msg => {
                                                                                                                                                                                                                                                                                                                                    if (msg.role === "user") {
                                                                                                                                                                                                                                                                                                                                                            html += `\n<span class="user">[محمد] &gt;&gt; ${escapeHTML(msg.text)}</span>\n`;
                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                        html += `<span class="ai">[Cyber OHGS]</span> ${escapeHTML(msg.text)}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                html += `--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.innerHTML = html;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function resetMemory() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (isProcessing) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (confirm("هل تريد مسح ذاكرة المحادثة والبدء من جديد؟")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    localStorage.removeItem('cyber_memory');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    memory = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("log").innerHTML = "<span class='ai'>[Cyber OHGS]</span> تم تصفير الذاكرة. النظام جاهز من جديد...\n--------------------------------------------------";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function escapeHTML(text) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return text
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .replace(/&/g, "&amp;")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .replace(/</g, "&lt;")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .replace(/>/g, "&gt;")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .replace(/"/g, "&quot;")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .replace(/'/g, "&#039;");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function addUserMessage(text) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const l = document.getElementById("log");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `\n<span class="user">[محمد] &gt;&gt; ${escapeHTML(text)}</span>\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function typeWriterEffect(text) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const l = document.getElementById("log");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class="ai">[Cyber OHGS]</span> `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                for (let i = 0; i < text.length; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.innerHTML += escapeHTML(text[i]);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await new Promise(resolve => setTimeout(resolve, 15));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function runCyber() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (isProcessing) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const t = document.getElementById("txt");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const q = t.value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!q) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            isProcessing = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        t.value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    addUserMessage(q);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                memory.push({ role: "user", text: q });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (memory.length > 20) memory.shift();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        localStorage.setItem('cyber_memory', JSON.stringify(memory));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // محاكاة رد طبيعي للنظام بشكل مؤقت
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                setTimeout(async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const answer = "وصلت رسالتك يا محمد، أنا جاهز للتعديل بالشكل الذي تفضله.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                memory.push({ role: "assistant", text: answer });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (memory.length > 20) memory.shift();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                localStorage.setItem('cyber_memory', JSON.stringify(memory));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await typeWriterEffect(answer);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                isProcessing = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.onload = renderHistory;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
