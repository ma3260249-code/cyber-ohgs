<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gideon Core v12.0</title>
                <style>
                        body { background: #030712; color: #38bdf8; font-family: monospace; padding: 10px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                                .box { width: 100%; max-width: 650px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; }
                                        .console { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; text-align: right; }
                                                .row { display: flex; gap: 8px; }
                                                        textarea { flex: 1; padding: 10px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 6px; font-size: 13px; height: 40px; resize: none; direction: ltr; text-align: left; }
                                                                button { padding: 0 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
                                                                        .ai { color: #c084fc; font-weight: bold; }
                                                                                .user { color: #38bdf8; font-weight: bold; }
                                                                                        .ok { color: #4ade80; }
                                                                                                .err { color: #f43f5e; }
                                                                                                        .info { color: #facc15; }
                                                                                                            </style>
                                                                                                            </head>
                                                                                                            <body>
                                                                                                                <div class="box">
                                                                                                                        <div style="margin-bottom: 8px; font-size: 13px; color: #c084fc;"><b>Gideon Core v12.0 - Neural Interface</b></div>
                                                                                                                                <div id="log" class="console"><span class='ai'>[Gideon]</span> تم تهيئة النواة بنجاح. أستمع إليك يا محمد...
                                                                                                                                --------------------------------------------------</div>
                                                                                                                                        <div class="row">
                                                                                                                                                    <textarea id="txt" placeholder="اكتب ما تريد..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();runGideon();}" autofocus></textarea>
                                                                                                                                                                <button onclick="runGideon()">إرسال</button>
                                                                                                                                                                        </div>
                                                                                                                                                                            </div>

                                                                                                                                                                                <script>
                                                                                                                                                                                        // الذاكرة النشطة لتخزين السياق بصمت
                                                                                                                                                                                                let memory = [];

                                                                                                                                                                                                        const kb = {
                                                                                                                                                                                                                    "google.com": { type: "محرك البحث والخدمات السحابية", founded: "1998", desc: "البوابة التقنية الأولى للبحث والمعلومات." },
                                                                                                                                                                                                                                "github.com": { type: "منصة تطوير البرمجيات", founded: "2008", desc: "استضافة الأكواد وإدارة المشاريع التقنية." }
                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                async function runGideon() {
                                                                                                                                                                                                                                                            let t = document.getElementById('txt');
                                                                                                                                                                                                                                                                        let l = document.getElementById('log');
                                                                                                                                                                                                                                                                                    let q = t.value.trim();
                                                                                                                                                                                                                                                                                                if (!q) return;

                                                                                                                                                                                                                                                                                                            // حفظ الكلام في الذاكرة بصمت تام دون إزعاج المستخدم
                                                                                                                                                                                                                                                                                                                        memory.push({ role: "user", text: q });
                                                                                                                                                                                                                                                                                                                                    if (memory.length > 15) memory.shift();

                                                                                                                                                                                                                                                                                                                                                l.innerHTML += `\n<span class='user'>[محمد] >> ${q}</span>\n`;
                                                                                                                                                                                                                                                                                                                                                            t.value = "";
                                                                                                                                                                                                                                                                                                                                                                        l.scrollTop = l.scrollHeight;

                                                                                                                                                                                                                                                                                                                                                                                    let lower = q.toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                let isLink = lower.includes('http') || lower.includes('.com') || lower.includes('.org') || lower.includes('.net') || lower.includes('.jo');

                                                                                                                                                                                                                                                                                                                                                                                                            if (!isLink) {
                                                                                                                                                                                                                                                                                                                                                                                                                            let ans = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                            let lastTopic = memory.length > 1 ? memory[memory.length - 2].text : "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                            // ردود بنبرة "غيدون" التقنية والهادئة
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (lower.includes('شلونك') || lower.includes('كيفك') || lower.includes('اخبارك')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ans = "جميع الأنظمة تعمل بكفاءة تامة يا محمد.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                else if (lower.includes('مرحبا') || lower.includes('هلا') || lower.includes('السلام')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ans = "أهلاً بك. أنا معك وجاهزة لأي أمر.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else if (lower.includes('شو حكيتلك') || lower.includes('ماذا قلت') || lower.includes('تتذكر')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ans = `نعم، آخر مدخلات تم تسجيلها في الذاكرة هي: "${lastTopic}".`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else if (lower.includes('اسمك') || lower.includes('من انت')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ans = "أنا غيدون (Gideon)، نظام التشغيل والذكاء الاصطناعي الخاص بك.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // ردود تقنية هادئة تشبه أسلوب المسلسلات بدون أسئلة متعبة
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let responses = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `تم معالجة الطلب وتحديث السجل السياقي بنجاح.`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `أستوعب المعطيات بدقة يا محمد. تابع، أنا أستمع.`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `تم حفظ النقطة في الذاكرة النشطة. ما هي الخطوة التالية التي تريد تنفيذها؟`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `المعلومات مسجلة بالكامل في قاعدة البيانات الحالية.`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ans = responses[q.length % responses.length];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            memory.push({ role: "ai", text: ans });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.innerHTML += `<span class='ai'>[Gideon]</span> ${ans}\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // مسار الفحص
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.innerHTML += `<span class='ai'>[Gideon]</span> جاري فحص النطاق واستخراج بيانات البنية التحتية...\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await new Promise(r => setTimeout(r, 300));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let m = q.match(/(?:https?:\/\/)?(?:www\.)?([a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+)/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let domain = m ? m[1] : "google.com";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let item = kb[domain] || { type: "نطاق رقمي نشط", founded: "غير محدد", desc: "متصل على الشبكة العنكبوتية." };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let res = `https://dns.google/resolve?name=${domain}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let data = await (await fetch(res)).json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (data.Answer && data.Answer.length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let ip = data.Answer[0].data;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let report = `[تقرير النظام]\n - الهدف: ${domain}\n - التصنيف: ${item.type}\n - التأسيس: ${item.founded}\n - الوصف: ${item.desc}\n - عنوان IP: ${ip}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class='ok'>${report}</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class='err'>[!] لا توجد سجلات نشطة لهذا النطاق.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class='err'>[!] خطأ في الاتصال بالشبكة.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
