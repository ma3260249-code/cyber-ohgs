<!DOCTYPE html><html lang="ar" dir="rtl">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cyber OHGS - Dashboard</title><style>
    *{box-sizing:border-box;margin:0;padding:0}

    body{
        background:#0b0f19;
            color:#d1d5db;
                font-family:Tahoma,Arial,sans-serif;
                    min-height:100vh;
                    }

                    .sidebar{
                        position:fixed;
                            top:0;
                                right:0;
                                    bottom:0;
                                        width:110px;
                                            background:#111827;
                                                border-left:1px solid #1f2937;
                                                }

                                                .brand{
                                                    padding:15px 5px;
                                                        text-align:center;
                                                            font-size:11px;
                                                                font-weight:bold;
                                                                    color:#60a5fa;
                                                                        border-bottom:1px solid #1f2937;
                                                                        }

                                                                        .nav-item{
                                                                            padding:12px 8px;
                                                                                font-size:10px;
                                                                                    color:#9ca3af;
                                                                                        border-bottom:1px solid #1f2937;
                                                                                            text-align:right;
                                                                                                cursor:pointer;
                                                                                                }

                                                                                                .nav-item.active{
                                                                                                    background:#1f2937;
                                                                                                        color:#38bdf8;
                                                                                                            border-right:3px solid #38bdf8;
                                                                                                            }

                                                                                                            .main{
                                                                                                                margin-right:110px;
                                                                                                                    padding:15px;
                                                                                                                        min-height:100vh;
                                                                                                                        }

                                                                                                                        .metrics{
                                                                                                                            display:grid;
                                                                                                                                grid-template-columns:repeat(2,1fr);
                                                                                                                                    gap:10px;
                                                                                                                                        margin-bottom:12px;
                                                                                                                                        }

                                                                                                                                        .card{
                                                                                                                                            background:#111827;
                                                                                                                                                border:1px solid #1f2937;
                                                                                                                                                    padding:12px;
                                                                                                                                                        border-radius:6px;
                                                                                                                                                        }

                                                                                                                                                        .title{
                                                                                                                                                            font-size:9px;
                                                                                                                                                                color:#9ca3af;
                                                                                                                                                                    margin-bottom:4px;
                                                                                                                                                                    }

                                                                                                                                                                    .value{
                                                                                                                                                                        font-size:13px;
                                                                                                                                                                            color:#34d399;
                                                                                                                                                                                font-weight:bold;
                                                                                                                                                                                }

                                                                                                                                                                                .console{
                                                                                                                                                                                    background:#030712;
                                                                                                                                                                                        border:1px solid #1f2937;
                                                                                                                                                                                            border-radius:6px;
                                                                                                                                                                                                padding:12px;
                                                                                                                                                                                                    min-height:130px;
                                                                                                                                                                                                        margin-bottom:12px;
                                                                                                                                                                                                            color:#60a5fa;
                                                                                                                                                                                                                font:11px/1.5 monospace;
                                                                                                                                                                                                                    direction:ltr;
                                                                                                                                                                                                                        text-align:left;
                                                                                                                                                                                                                            overflow-wrap:anywhere;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                            .controls{
                                                                                                                                                                                                                                display:flex;
                                                                                                                                                                                                                                    gap:8px;
                                                                                                                                                                                                                                        margin-bottom:12px;
                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                        input{
                                                                                                                                                                                                                                            flex:1;
                                                                                                                                                                                                                                                min-width:0;
                                                                                                                                                                                                                                                    background:#111827;
                                                                                                                                                                                                                                                        border:1px solid #1f2937;
                                                                                                                                                                                                                                                            padding:10px;
                                                                                                                                                                                                                                                                color:#fff;
                                                                                                                                                                                                                                                                    border-radius:6px;
                                                                                                                                                                                                                                                                        font-size:12px;
                                                                                                                                                                                                                                                                            outline:none;
                                                                                                                                                                                                                                                                                direction:ltr;
                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                button{
                                                                                                                                                                                                                                                                                    border:0;
                                                                                                                                                                                                                                                                                        border-radius:6px;
                                                                                                                                                                                                                                                                                            cursor:pointer;
                                                                                                                                                                                                                                                                                                font-weight:bold;
                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                .execute{
                                                                                                                                                                                                                                                                                                    background:#2563eb;
                                                                                                                                                                                                                                                                                                        color:#fff;
                                                                                                                                                                                                                                                                                                            padding:10px 16px;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                            .history{
                                                                                                                                                                                                                                                                                                                background:#111827;
                                                                                                                                                                                                                                                                                                                    border:1px solid #1f2937;
                                                                                                                                                                                                                                                                                                                        border-radius:6px;
                                                                                                                                                                                                                                                                                                                            padding:12px;
                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                            .history-head{
                                                                                                                                                                                                                                                                                                                                display:flex;
                                                                                                                                                                                                                                                                                                                                    justify-content:space-between;
                                                                                                                                                                                                                                                                                                                                        align-items:center;
                                                                                                                                                                                                                                                                                                                                            margin-bottom:8px;
                                                                                                                                                                                                                                                                                                                                                font-size:10px;
                                                                                                                                                                                                                                                                                                                                                    color:#9ca3af;
                                                                                                                                                                                                                                                                                                                                                        gap:5px;
                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                        .clear{
                                                                                                                                                                                                                                                                                                                                                            background:#ef4444;
                                                                                                                                                                                                                                                                                                                                                                color:#fff;
                                                                                                                                                                                                                                                                                                                                                                    padding:3px 8px;
                                                                                                                                                                                                                                                                                                                                                                        font-size:9px;
                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                        .history-list{
                                                                                                                                                                                                                                                                                                                                                                            max-height:120px;
                                                                                                                                                                                                                                                                                                                                                                                overflow-y:auto;
                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                .history-item{
                                                                                                                                                                                                                                                                                                                                                                                    font:10px monospace;
                                                                                                                                                                                                                                                                                                                                                                                        color:#34d399;
                                                                                                                                                                                                                                                                                                                                                                                            background:#030712;
                                                                                                                                                                                                                                                                                                                                                                                                padding:6px;
                                                                                                                                                                                                                                                                                                                                                                                                    border-radius:4px;
                                                                                                                                                                                                                                                                                                                                                                                                        margin-bottom:4px;
                                                                                                                                                                                                                                                                                                                                                                                                            direction:ltr;
                                                                                                                                                                                                                                                                                                                                                                                                                text-align:left;
                                                                                                                                                                                                                                                                                                                                                                                                                    overflow-wrap:anywhere;
                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                    .empty{
                                                                                                                                                                                                                                                                                                                                                                                                                        color:#4b5563;
                                                                                                                                                                                                                                                                                                                                                                                                                            font:10px monospace;
                                                                                                                                                                                                                                                                                                                                                                                                                                direction:ltr;
                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                @media(max-width:500px){
                                                                                                                                                                                                                                                                                                                                                                                                                                    .sidebar{width:90px}
                                                                                                                                                                                                                                                                                                                                                                                                                                        .main{margin-right:90px;padding:10px}
                                                                                                                                                                                                                                                                                                                                                                                                                                            .metrics{gap:6px}
                                                                                                                                                                                                                                                                                                                                                                                                                                                .controls{flex-direction:column}
                                                                                                                                                                                                                                                                                                                                                                                                                                                    .execute{width:100%}
                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </style></head><body><aside class="sidebar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="brand">OHGS Pro</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="nav-item active">📁 لوحة التحكم</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="nav-item">🛡️ الحماية</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="nav-item">🔍 فحص عميق</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="nav-item">📊 الشبكة</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </aside><main class="main"><section class="metrics">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="title">إجمالي العمليات</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="value" id="opCount">4 عمليات</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="title">حالة النظام</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="value">مستقر وآمن</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <section class="console" id="consoleLog">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        > [System initialized]: Dark mode active.<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        > [Ready]: Type target endpoint below to execute process.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <section class="controls">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="execute" id="executeBtn">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    تنفيذ العملية
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    id="targetInput"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    autocomplete="off"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            placeholder="https://target-domain.com"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <section class="history">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="history-head">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span>سجل العمليات السابقة (Execution History)</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="clear" id="clearBtn">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                مسح السجل
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="history-list" id="historyContainer">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="empty">// لا توجد سجلات حالياً...</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </main><script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "use strict";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let operationsCount = 4;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const historyArray = [];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const input = document.getElementById("targetInput");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const consoleLog = document.getElementById("consoleLog");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const opCount = document.getElementById("opCount");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const historyContainer = document.getElementById("historyContainer");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const executeBtn = document.getElementById("executeBtn");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const clearBtn = document.getElementById("clearBtn");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function escapeHTML(value){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return value
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .replace(/&/g,"&amp;")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .replace(/</g,"&lt;")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .replace(/>/g,"&gt;")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .replace(/"/g,"&quot;")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .replace(/'/g,"&#039;");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function renderHistory(){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            historyContainer.textContent = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(historyArray.length === 0){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const empty = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                empty.className = "empty";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        empty.textContent = "// لا توجد سجلات حالياً...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                historyContainer.appendChild(empty);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const fragment = document.createDocumentFragment();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    historyArray.forEach(function(item,index){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const entry = document.createElement("div");
