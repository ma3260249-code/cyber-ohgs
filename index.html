<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cyber OHGS Lite</title>
                <style>
                        body {
                                    background-color: #121212;
                                                color: #00ffcc;
                                                            font-family: monospace;
                                                                        padding: 15px;
                                                                                    margin: 0;
                                                                                            }
                                                                                                    .box {
                                                                                                                background: #1e1e1e;
                                                                                                                            border: 1px solid #333;
                                                                                                                                        padding: 15px;
                                                                                                                                                    border-radius: 8px;
                                                                                                                                                                max-width: 400px;
                                                                                                                                                                            margin: auto;
                                                                                                                                                                                    }
                                                                                                                                                                                            h2 { color: #bb86fc; font-size: 16px; margin-bottom: 10px; }
                                                                                                                                                                                                    input, button {
                                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                                            padding: 10px;
                                                                                                                                                                                                                                        margin-top: 8px;
                                                                                                                                                                                                                                                    background: #2d2d2d;
                                                                                                                                                                                                                                                                border: 1px solid #444;
                                                                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                                                                        border-radius: 4px;
                                                                                                                                                                                                                                                                                                    font-family: monospace;
                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                    button {
                                                                                                                                                                                                                                                                                                                                background: #03dac6;
                                                                                                                                                                                                                                                                                                                                            color: #000;
                                                                                                                                                                                                                                                                                                                                                        font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                    .console {
                                                                                                                                                                                                                                                                                                                                                                                                background: #000;
                                                                                                                                                                                                                                                                                                                                                                                                            color: #03dac6;
                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                    margin-top: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 4px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        min-height: 50px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    direction: ltr;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                text-align: left;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h2>Cyber OHGS [Lite Mode]</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="target" placeholder="أدخل الرابط هنا...">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="runTest()">تشغيل الفحص</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="console" id="log">النظام جاهز...</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function runTest() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const val = document.getElementById('target').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const log = document.getElementById('log');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(!val) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert('الرجاء كتابة رابط أولاً');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            log.innerHTML = `> فحص الهدف: ${val}<br>> الحالة: آمن ومستقر 100%`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
