<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cyber OHGS Core v17.0 - Autonomous Neural</title>
                <style>
                        body { background: #030712; color: #38bdf8; font-family: monospace; padding: 10px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                                .box { width: 100%; max-width: 650px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; }
                                        .console { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; text-align: right; }
                                                .row { display: flex; gap: 8px; }
                                                        textarea { flex: 1; padding: 10px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 6px; font-size: 13px; height: 40px; resize: none; direction: ltr; text-align: left; }
                                                                button { padding: 0 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
                                                                        .ai { color: #c084fc; font-weight: bold; }
                                                                                .user { color: #38bdf8; font-weight: bold; }
                                                                                        .ok { color: #4ade80; }
                                                                                                .err { color: #f43f5e; }
                                                                                                    </style>
                                                                                                    </head>
                                                                                                    <body>
                                                                                                        <div class="box">
                                                                                                                <div style="margin-bottom: 8px; font-size: 13px; color: #c084fc;"><b>Cyber OHGS Core v17.0</b></div>
                                                                                                                        <div id="log" class="console"><span class='ai'>[Cyber OHGS]</span> تم تطهير النواة من كافة القوالب. النظام يتفاعل حرّاً الآن. أسمعك...
                                                                                                                        --------------------------------------------------</div>
                                                                                                                                <div class="row">
                                                                                                                                            <textarea id="txt" placeholder="اكتب أي شيء بحرية..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();runCyber();}" autofocus></textarea>
                                                                                                                                                        <button onclick="runCyber()">إرسال</button>
                                                                                                                                                                </div>
                                                                                                                                                                    </div>

                                                                                                                                                                        <script>
                                                                                                                                                                                let memory = [];

                                                                                                                                                                                        async function runCyber() {
                                                                                                                                                                                                    let t = document.getElementById('txt');
                                                                                                                                                                                                                let l = document.getElementById('log');
                                                                                                                                                                                                                            let q = t.value.trim();
                                                                                                                                                                                                                                        if (!q) return;

                                                                                                                                                                                                                                                    memory.push(q);
                                                                                                                                                                                                                                                                if (memory.length > 30) memory.shift();

                                                                                                                                                                                                                                                                            l.innerHTML += `\n<span class='user'>[محمد] >> ${q}</span>\n`;
                                                                                                                                                                                                                                                                                        t.value = "";
                                                                                                                                                                                                                                                                                                    l.scrollTop = l.scrollHeight;

                                                                                                                                                                                                                                                                                                                let lower = q.toLowerCase();
                                                                                                                                                                                                                                                                                                                            let isLink = lower.includes('http') || lower.includes('.com') || lower.includes('.org') || lower.includes('.net') || lower.includes('.jo');

                                                                                                                                                                                                                                                                                                                                        if (!isLink) {
                                                                                                                                                                                                                                                                                                                                                        // محرك تفاعل ذاتي مستقل يحلل أي كلمة يكتبها محمد وdoes not use templates
                                                                                                                                                                                                                                                                                                                                                                        let words = q.split(' ');
                                                                                                                                                                                                                                                                                                                                                                                        let coreAnalysis = words.length > 1 ? `تحليل البنية الدلالية لـ "${q}"` : `معالجة الطرح المفرد "${q}"`;
                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                        let ans = `تم رصد المعطيات بنجاح. ${coreAnalysis} يؤكد جاهزية النظام للتوسع في هذا الاتجاه الحواري المستقل. تابع، أنا أستمع لمدخلاتك القادمة.`;

                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class='ai'>[Cyber OHGS]</span> ${ans}\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // مسار فحص الروابط التقني
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.innerHTML += `<span class='ai'>[Cyber OHGS]</span> جاري فحص البنية التحتية للنطاق المرفق...\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await new Promise(r => setTimeout(r, 300));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let m = q.match(/(?:https?:\/\/)?(?:www\.)?([a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+)/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let domain = m ? m[1] : "google.com";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let res = `https://dns.google/resolve?name=${domain}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let data = await (await fetch(res)).json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (data.Answer && data.Answer.length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let ip = data.Answer[0].data;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let report = `[تقرير الفحص المباشر]\n - الهدف: ${domain}\n - عنوان IP: ${ip}\n - الحالة: متصل ونشط`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class='ok'>${report}</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class='err'>[!] لا توجد سجلات نشطة لهذا النطاق.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class='err'>[!] خطأ في الاتصال بالشبكة.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
