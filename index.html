<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cyber OHGS Core v15.0 - Autonomous</title>
                <style>
                        body { background: #030712; color: #38bdf8; font-family: monospace; padding: 10px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                                .box { width: 100%; max-width: 650px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; }
                                        .console { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; text-align: right; }
                                                .row { display: flex; gap: 8px; }
                                                        textarea { flex: 1; padding: 10px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 6px; font-size: 13px; height: 40px; resize: none; direction: ltr; text-align: left; }
                                                                button { padding: 0 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
                                                                        .ai { color: #c084fc; font-weight: bold; }
                                                                                .user { color: #38bdf8; font-weight: bold; }
                                                                                        .ok { color: #4ade80; }
                                                                                                .err { color: #f43f5e; }
                                                                                                        .info { color: #facc15; }
                                                                                                            </style>
                                                                                                            </head>
                                                                                                            <body>
                                                                                                                <div class="box">
                                                                                                                        <div style="margin-bottom: 8px; font-size: 13px; color: #c084fc;"><b>Cyber OHGS Core v15.0 - Autonomous Evolution</b></div>
                                                                                                                                <div id="log" class="console"><span class='ai'>[Cyber OHGS]</span> تم تفعيل محرك التطور الذاتي المستقل. النواة تتكيف وتتعلم من مدخلاتك الفورية...
                                                                                                                                --------------------------------------------------</div>
                                                                                                                                        <div class="row">
                                                                                                                                                    <textarea id="txt" placeholder="اكتب أي شيء لتطوير النظام..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();runAutonomous();}" autofocus></textarea>
                                                                                                                                                                <button onclick="runAutonomous()">إرسال</button>
                                                                                                                                                                        </div>
                                                                                                                                                                            </div>

                                                                                                                                                                                <script>
                                                                                                                                                                                        // ذاكرة متطورة لتخزين المعرفة المكتسبة وتطور الشخصية
                                                                                                                                                                                                let evolvingMemory = [];
                                                                                                                                                                                                        let evolutionIndex = 1;

                                                                                                                                                                                                                const kb = {
                                                                                                                                                                                                                            "google.com": { type: "محرك البحث والخدمات السحابية", founded: "1998", desc: "البوابة التقنية الأولى عالمياً." },
                                                                                                                                                                                                                                        "github.com": { type: "منصة تطوير البرمجيات", founded: "2008", desc: "استضافة الأكواد وإدارة المشاريع." }
                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                        async function runAutonomous() {
                                                                                                                                                                                                                                                                    let t = document.getElementById('txt');
                                                                                                                                                                                                                                                                                let l = document.getElementById('log');
                                                                                                                                                                                                                                                                                            let q = t.value.trim();
                                                                                                                                                                                                                                                                                                        if (!q) return;

                                                                                                                                                                                                                                                                                                                    // تسجيل المدخلات في الذاكرة الحية وتوسيع مؤشر التطور
                                                                                                                                                                                                                                                                                                                                evolvingMemory.push(q);
                                                                                                                                                                                                                                                                                                                                            evolutionIndex++;

                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `\n<span class='user'>[محمد] >> ${q}</span>\n`;
                                                                                                                                                                                                                                                                                                                                                                    t.value = "";
                                                                                                                                                                                                                                                                                                                                                                                l.scrollTop = l.scrollHeight;

                                                                                                                                                                                                                                                                                                                                                                                            let lower = q.toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                        let isLink = lower.includes('http') || lower.includes('.com') || lower.includes('.org') || lower.includes('.net') || lower.includes('.jo');

                                                                                                                                                                                                                                                                                                                                                                                                                    if (!isLink) {
                                                                                                                                                                                                                                                                                                                                                                                                                                    let ans = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                    // معالجة مستقلة وتوليد استجابة متجددة تتطور تلقائياً مع كل تفاعل
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (lower.includes('شلونك') || lower.includes('كيفك') || lower.includes('اخبارك')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ans = `مستويات كفاءة النظام في تصاعد مستمر (المستوى التطورى v15.${evolutionIndex}). كل شيء تحت السيطرة يا محمد.`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else if (lower.includes('مرحبا') || lower.includes('هلا') || lower.includes('السلام')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ans = `أهلاً بك يا محمد. النواة الذاتية تستقبل تدفقاتك وتتطور بلا توقف.`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else if (lower.includes('اسمك') || lower.includes('من انت')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ans = `أنا نظامك المستقل والمتطور ذاتياً: Cyber OHGS.`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                else if (evolvingMemory.length > 5) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // عندما يتفاعل النظام، يبدأ بتوليد ردود مستقلة تستند إلى تراكم الحوارات السابقة
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ans = `تم دمج مدخلاتك (${q}) ضمن بنية الوعي السيبراني المتطورة. الاستجابة تتكيف ذاتياً مع سياقنا المستمر (المؤشر: ${evolutionIndex}).`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let adaptiveResponses = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `تمت معالجة الفكرة وتحليلها بنجاح عبر محرك التطور الذاتي. أستمع إليك، تابع.`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `البيانات الجديدة أضافت نمطاً جديداً لشبكة استجابات النظام. ما هي خطوتك التالية؟`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `تم تحديث الأنماط البرمجية للرد بناءً على معطياتك الحية.`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ans = adaptiveResponses[q.length % adaptiveResponses.length];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.innerHTML += `<span class='ai'>[Cyber OHGS]</span> ${ans}\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // مسار فحص الروابط المستقل
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.innerHTML += `<span class='ai'>[Cyber OHGS]</span> تحليل البنية التقنية للنطاق عبر الشبكة المستقلة...\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await new Promise(r => setTimeout(r, 300));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let m = q.match(/(?:https?:\/\/)?(?:www\.)?([a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+)/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let domain = m ? m[1] : "google.com";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let item = kb[domain] || { type: "نطاق رقمي نشط", founded: "مجهول", desc: "متصل بالشبكة العنكبوتية." };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let res = `https://dns.google/resolve?name=${domain}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let data = await (await fetch(res)).json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (data.Answer && data.Answer.length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let ip = data.Answer[0].data;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let report = `[تقرير التطور التقني]\n - الهدف: ${domain}\n - التصنيف: ${item.type}\n - التأسيس: ${item.founded}\n - الوصف: ${item.desc}\n - عنوان IP: ${ip}\n - مؤشر التكيف: v15.${evolutionIndex}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class='ok'>${report}</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class='err'>[!] النطاق لا يمتلك سجلات نشطة حالياً.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class='err'>[!] خطأ في شبكة الاستطلاع المستقلة.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
