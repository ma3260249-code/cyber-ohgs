<script>
    // دالة الفحص الحقيقي المدمجة مع واجهة Cyber OHGS
    async function startScan() {
        // 1. التقاط مدخلات المستخدم وعنصر عرض النتائج في واجهة Cyber OHGS
            const inputElement = document.getElementById('urlInput');
                // محاولة إيجاد مكان عرض النتائج المخصص في تصميمك أو استخدام بديل آمن
                    const consoleBox = document.querySelector('textarea') || document.querySelector('.console-box') || document.getElementById('resultConsole');

                        if (!inputElement || !inputElement.value.trim()) {
                                alert('الرجاء إدخال الرابط المطلوب فحصه في الحقل المخصص.');
                                        return;
                                            }

                                                const urlToScan = inputElement.value.trim();

                                                    // رسالة تنبيه داخل واجهة العمليات (تصميم Cyber OHGS)
                                                        if (consoleBox) {
                                                                consoleBox.value = `[تشغيل النظام]: جاري إرسال الرابط وتحليله عبر طبقة النقل المباشر إلى قواعد بيانات VirusTotal...`;
                                                                    }

                                                                        // مفتاح الـ API الخاص بك
                                                                            const apiKey = '288e0c33bc8f29657b38ba1ba9646319eebf207348f3cb52c97cc2b36a66ad31';

                                                                                try {
                                                                                        // تشفير الرابط بالصيغة المطلوبة
                                                                                                const encodedUrl = btoa(urlToScan).replace(/=/g, '');
                                                                                                        
                                                                                                                // جلب البيانات عبر الوسيط الآمن
                                                                                                                        const response = await fetch(`https://corsproxy.io/?https://www.virustotal.com/api/v3/urls/${encodedUrl}`, {
                                                                                                                                    headers: { 'x-apikey': apiKey }
                                                                                                                                            });

                                                                                                                                                    if (!response.ok) {
                                                                                                                                                                throw new Error('لم يتم رصد سجل فحص سابق لهذا الرابط أو أن خادم الفحص مشغول.');
                                                                                                                                                                        }

                                                                                                                                                                                const data = await response.json();
                                                                                                                                                                                        const stats = data.data.attributes.last_analysis_stats;
                                                                                                                                                                                                
                                                                                                                                                                                                        const malicious = stats.malicious;
                                                                                                                                                                                                                const harmless = stats.harmless;
                                                                                                                                                                                                                        const suspicious = stats.suspicious;
                                                                                                                                                                                                                                const total = malicious + harmless + suspicious;

                                                                                                                                                                                                                                        // طباعة النتيجة الحقيقية بشكل يتناسب مع واجهة البرمجية لديك
                                                                                                                                                                                                                                                let resultText = `\n--- [تقرير الفحص السيبراني الحقيقي] ---\n`;
                                                                                                                                                                                                                                                        resultText += `> الرابط المستهدف: ${urlToScan}\n`;
                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                        if (malicious > 0) {
                                                                                                                                                                                                                                                                                    resultText += `> [!] تحذير خطير: تم رصد برمجيات خبيثة!\n`;
                                                                                                                                                                                                                                                                                                resultText += `> جهات الحماية المحذرة: ${malicious} من أصل ${total}\n`;
                                                                                                                                                                                                                                                                                                            resultText += `> مستوى الخطورة: عالي جداً (غير آمن للاستخدام)\n`;
                                                                                                                                                                                                                                                                                                                    } else if (suspicious > 0) {
                                                                                                                                                                                                                                                                                                                                resultText += `> [!] تنبيه: الرابط مشبوه.\n`;
                                                                                                                                                                                                                                                                                                                                            resultText += `> الجهات المشككة: ${suspicious} من أصل ${total}\n`;
                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                resultText += `> [+] النتيجة: الفحص نظيف تماماً.\n`;
                                                                                                                                                                                                                                                                                                                                                                            resultText += `> مستوى الخطورة: 0% (آمن للاستخدام)\n`;
                                                                                                                                                                                                                                                                                                                                                                                        resultText += `> الجهات الآمنة والموافقة: ${harmless} من أصل ${total}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                        if (consoleBox) {
                                                                                                                                                                                                                                                                                                                                                                                                                    consoleBox.value = resultText;
                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                        if (consoleBox) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    consoleBox.value = `[خطأ في الاتصال]: ${error.message}\nتأكد من كتابة الرابط بشكل صحيح (يبدأ بـ https://).`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
