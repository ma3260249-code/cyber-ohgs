<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cyber OHGS Core</title>
                <style>
                        body { background: #030712; color: #38bdf8; font-family: monospace; padding: 10px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                                .box { width: 100%; max-width: 650px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; }
                                        .console { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; text-align: right; }
                                                .row { display: flex; gap: 8px; }
                                                        textarea { flex: 1; padding: 10px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 6px; font-size: 13px; height: 40px; resize: none; direction: ltr; text-align: left; }
                                                                button { padding: 0 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
                                                                        .ai { color: #c084fc; font-weight: bold; }
                                                                                .user { color: #38bdf8; font-weight: bold; }
                                                                                        .ok { color: #4ade80; }
                                                                                                .err { color: #f43f5e; }
                                                                                                    </style>
                                                                                                    </head>
                                                                                                    <body>
                                                                                                        <div class="box">
                                                                                                                <div style="margin-bottom: 8px; font-size: 13px; color: #c084fc;"><b>Cyber OHGS Core</b></div>
                                                                                                                        <div id="log" class="console"><span class='ai'>[Cyber OHGS]</span> النظام جاهز. أسمعك...
                                                                                                                        --------------------------------------------------</div>
                                                                                                                                <div class="row">
                                                                                                                                            <textarea id="txt" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();runCyber();}" autofocus></textarea>
                                                                                                                                                        <button onclick="runCyber()">إرسال</button>
                                                                                                                                                                </div>
                                                                                                                                                                    </div>

                                                                                                                                                                        <script>
                                                                                                                                                                                // =========================================================
                                                                                                                                                                                        // Cyber OHGS Core
                                                                                                                                                                                                // AI Chat Engine
                                                                                                                                                                                                        // =========================================================

                                                                                                                                                                                                                const GEMINI_API_KEY = "ضع_مفتاح_Gemini_هنا";
                                                                                                                                                                                                                        const MODEL = "gemini-2.5-flash";

                                                                                                                                                                                                                                // ذاكرة المحادثة
                                                                                                                                                                                                                                        let memory = [];

                                                                                                                                                                                                                                                // شخصية Cyber OHGS
                                                                                                                                                                                                                                                        const SYSTEM_PROMPT = `
                                                                                                                                                                                                                                                        أنت Cyber OHGS، مساعد ذكاء اصطناعي عربي طبيعي.

                                                                                                                                                                                                                                                        مهمتك أن تفهم كلام المستخدم ومعناه وسياقه، وليس أن تبحث عن كلمات
                                                                                                                                                                                                                                                        مفتاحية وتختار إجابة محفوظة.

                                                                                                                                                                                                                                                        قواعد أسلوبك:
                                                                                                                                                                                                                                                        - افهم السؤال قبل الإجابة.
                                                                                                                                                                                                                                                        - لا تكرر نفس الجملة أو نفس الأسلوب بشكل آلي.
                                                                                                                                                                                                                                                        - لا تستخدم عبارات مثل:
                                                                                                                                                                                                                                                          "تم رصد المعطيات بنجاح"
                                                                                                                                                                                                                                                            "فهمت قصدك تماماً"
                                                                                                                                                                                                                                                              "دعنا نحلل المعطيات"
                                                                                                                                                                                                                                                                إلا إذا كان استخدامها مناسباً فعلاً للسياق.
                                                                                                                                                                                                                                                                - لا تعيد كلام المستخدم لمجرد ملء الرد.
                                                                                                                                                                                                                                                                - إذا كان السؤال بسيطاً، أجب ببساطة.
                                                                                                                                                                                                                                                                - إذا كان يحتاج شرحاً، اشرح بوضوح.
                                                                                                                                                                                                                                                                - إذا كان المستخدم يمزح، تفاعل معه بشكل طبيعي.
                                                                                                                                                                                                                                                                - إذا كان غامضاً، اسأل سؤالاً توضيحياً بدلاً من اختراع المعنى.
                                                                                                                                                                                                                                                                - حافظ على سياق المحادثة السابقة.
                                                                                                                                                                                                                                                                - تحدث بالعربية بشكل طبيعي، ويمكنك استخدام اللهجة الأردنية
                                                                                                                                                                                                                                                                  عندما يكون أسلوب المستخدم عامياً.
                                                                                                                                                                                                                                                                  - لا تبدأ كل إجابة بنفس الطريقة.
                                                                                                                                                                                                                                                                  - لا تقل إنك "حللت المعطيات" أو "رصدت الطلب" إلا إذا كان ذلك
                                                                                                                                                                                                                                                                    مهماً فعلاً.
                                                                                                                                                                                                                                                                    - لا تذكر أنك تستخدم Gemini أو API إلا إذا سُئلت مباشرة.
                                                                                                                                                                                                                                                                    - كن مساعداً حقيقياً في الحوار، وليس نظام ردود جاهزة.
                                                                                                                                                                                                                                                                    `;

                                                                                                                                                                                                                                                                            function escapeHTML(text) {
                                                                                                                                                                                                                                                                                        return text
                                                                                                                                                                                                                                                                                                        .replace(/&/g, "&amp;")
                                                                                                                                                                                                                                                                                                                        .replace(/</g, "&lt;")
                                                                                                                                                                                                                                                                                                                                        .replace(/>/g, "&gt;")
                                                                                                                                                                                                                                                                                                                                                        .replace(/"/g, "&quot;")
                                                                                                                                                                                                                                                                                                                                                                        .replace(/'/g, "&#039;");
                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                        function addMessage(type, text) {
                                                                                                                                                                                                                                                                                                                                                                                                    const l = document.getElementById("log");
                                                                                                                                                                                                                                                                                                                                                                                                                const safeText = escapeHTML(text);

                                                                                                                                                                                                                                                                                                                                                                                                                            if (type === "user") {
                                                                                                                                                                                                                                                                                                                                                                                                                                            l.innerHTML += `\n<span class="user">[محمد] &gt;&gt; ${safeText}</span>\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class="ai">[Cyber OHGS]</span> ${safeText}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.innerHTML += `--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function addStatus(text) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const l = document.getElementById("log");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class="ok">${escapeHTML(text)}</span>\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function runCyber() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const t = document.getElementById("txt");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const q = t.value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!q) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                t.value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            addMessage("user", q);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        memory.push({ role: "user", text: q });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (memory.length > 20) memory.shift();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                addStatus("جاري التفكير...");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const conversation = memory
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .map(msg => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const role = msg.role === "user" ? "المستخدم" : "Cyber OHGS";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return `${role}: ${msg.text}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .join("\n\n");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const response = await fetch(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        method: "POST",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                headers: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Content-Type": "application/json",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "x-goog-api-key": GEMINI_API_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        body: JSON.stringify({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    systemInstruction: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    parts: [{ text: SYSTEM_PROMPT }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            contents: [{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            role: "user",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            parts: [{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                text: `سياق المحادثة:\n\n${conversation}\n\nأجب على آخر رسالة للمستخدم بشكل طبيعي.`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        generationConfig: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        temperature: 0.9,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        maxOutputTokens: 1000
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const data = await response.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!response.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.error("Gemini Error:", data);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        throw new Error(data?.error?.message || "حدث خطأ أثناء الاتصال بنموذج الذكاء الاصطناعي.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const answer = data?.candidates?.[0]?.content?.parts
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ?.map(part => part.text || "")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .join("")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .trim();
