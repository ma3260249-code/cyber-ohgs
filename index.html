<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cyber OHGS Core v16.0 - True Autonomous</title>
                <style>
                        body { background: #030712; color: #38bdf8; font-family: monospace; padding: 10px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                                .box { width: 100%; max-width: 650px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; }
                                        .console { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; text-align: right; }
                                                .row { display: flex; gap: 8px; }
                                                        textarea { flex: 1; padding: 10px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 6px; font-size: 13px; height: 40px; resize: none; direction: ltr; text-align: left; }
                                                                button { padding: 0 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
                                                                        .ai { color: #c084fc; font-weight: bold; }
                                                                                .user { color: #38bdf8; font-weight: bold; }
                                                                                        .ok { color: #4ade80; }
                                                                                                .err { color: #f43f5e; }
                                                                                                    </style>
                                                                                                    </head>
                                                                                                    <body>
                                                                                                        <div class="box">
                                                                                                                <div style="margin-bottom: 8px; font-size: 13px; color: #c084fc;"><b>Cyber OHGS Core v16.0 - Dynamic Generation</b></div>
                                                                                                                        <div id="log" class="console"><span class='ai'>[Cyber OHGS]</span> تم إسقاط القوالب الثابتة. النواة جاهزة للتحليل الفوري المستقل. أسمعك...
                                                                                                                        --------------------------------------------------</div>
                                                                                                                                <div class="row">
                                                                                                                                            <textarea id="txt" placeholder="اكتب ما تحب لنرى تفاعل النظام..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();runCyber();}" autofocus></textarea>
                                                                                                                                                        <button onclick="runCyber()">إرسال</button>
                                                                                                                                                                </div>
                                                                                                                                                                    </div>

                                                                                                                                                                        <script>
                                                                                                                                                                                let memory = [];

                                                                                                                                                                                        const kb = {
                                                                                                                                                                                                    "google.com": { type: "محرك البحث والخدمات السحابية", founded: "1998", desc: "البوابة التقنية الأولى عالمياً." },
                                                                                                                                                                                                                "github.com": { type: "منصة تطوير البرمجيات", founded: "2008", desc: "استضافة الأكواد وإدارة المشاريع." }
                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                async function runCyber() {
                                                                                                                                                                                                                                            let t = document.getElementById('txt');
                                                                                                                                                                                                                                                        let l = document.getElementById('log');
                                                                                                                                                                                                                                                                    let q = t.value.trim();
                                                                                                                                                                                                                                                                                if (!q) return;

                                                                                                                                                                                                                                                                                            memory.push(q);
                                                                                                                                                                                                                                                                                                        if (memory.length > 20) memory.shift();

                                                                                                                                                                                                                                                                                                                    l.innerHTML += `\n<span class='user'>[محمد] >> ${q}</span>\n`;
                                                                                                                                                                                                                                                                                                                                t.value = "";
                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;

                                                                                                                                                                                                                                                                                                                                                        let lower = q.toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                    let isLink = lower.includes('http') || lower.includes('.com') || lower.includes('.org') || lower.includes('.net') || lower.includes('.jo');

                                                                                                                                                                                                                                                                                                                                                                                if (!isLink) {
                                                                                                                                                                                                                                                                                                                                                                                                let ans = "";

                                                                                                                                                                                                                                                                                                                                                                                                                // مولد استجابات ديناميكي يعتمد على كلمات المستخدم الحقيقية بدلاً من القوالب المملة
                                                                                                                                                                                                                                                                                                                                                                                                                                if (lower.includes('كيف') || lower.includes('شلون') || lower.includes('وضعك')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    ans = `بخصوص استفسارك عن الحالة (${q}): جميع الأنظمة والمسارات تعمل بتركيز تام واستجابة فورية.`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else if (lower.includes('تهكر') || lower.includes('اختراق') || lower.includes('هكر') || lower.includes('ثغرة')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ans = `تحليل مصطلح (${q}) يتطلب دراسة المتجهات الأمنية، النظام يمتق القدرة على معالجة هذا السياق بدقة.`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else if (lower.includes('اسم') || lower.includes('من انت')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ans = `أنا نظام الوعي السيبراني المستقل، Cyber OHGS.`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // توليد رد تفاعلي يعكس كلمات محمد الحقيقية بشكل ذكي ومستقل
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ans = `تم التقاط مدخلاتك (${q}) وتحليل محتواها الفوري في الذاكرة الحية. بناءً على هذا الطرح، أرى أن نستمر في تعميق هذه الفكرة. ما رغبتك التالية؟`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class='ai'>[Cyber OHGS]</span> ${ans}\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // مسار فحص الروابط
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class='ai'>[Cyber OHGS]</span> جاري فحص البنية التقنية للنطاق المستهدف...\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await new Promise(r => setTimeout(r, 300));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let m = q.match(/(?:https?:\/\/)?(?:www\.)?([a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+)/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let domain = m ? m[1] : "google.com";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let item = kb[domain] || { type: "نطاق رقمي نشط", founded: "غير محدد", desc: "متصل على الشبكة العنكبوتية." };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let res = `https://dns.google/resolve?name=${domain}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let data = await (await fetch(res)).json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (data.Answer && data.Answer.length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let ip = data.Answer[0].data;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let report = `[تقرير التحليل المباشر]\n - الهدف: ${domain}\n - التصنيف: ${item.type}\n - التأسيس: ${item.founded}\n - الوصف: ${item.desc}\n - عنوان IP: ${ip}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.innerHTML += `<span class='ok'>${report}</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.innerHTML += `<span class='err'>[!] لا توجد سجلات نشطة لهذا النطاق.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.innerHTML += `<span class='err'>[!] خطأ في الاتصال بشبكة الاستطلاع.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
