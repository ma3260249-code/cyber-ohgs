<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cyber OHGS Agent v6.8</title>
                <style>
                        body { background: #030712; color: #38bdf8; font-family: monospace; padding: 10px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                                .box { width: 100%; max-width: 650px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; }
                                        .console { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; text-align: right; }
                                                .row { display: flex; gap: 8px; }
                                                        textarea { flex: 1; padding: 10px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 6px; font-size: 13px; height: 40px; resize: none; direction: ltr; text-align: left; }
                                                                button { padding: 0 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
                                                                        .ai { color: #c084fc; font-weight: bold; }
                                                                                .user { color: #38bdf8; font-weight: bold; }
                                                                                        .ok { color: #4ade80; }
                                                                                                .err { color: #f43f5e; }
                                                                                                        .info { color: #facc15; }
                                                                                                            </style>
                                                                                                            </head>
                                                                                                            <body>
                                                                                                                <div class="box">
                                                                                                                        <div style="margin-bottom: 8px; font-size: 13px; color: #c084fc;"><b>Cyber OHGS - Autonomous Agent v6.8</b></div>
                                                                                                                                <div id="log" class="console"><span class='ai'>[ النظام جاهز ]</span> تم تفعيل محرك تواريخ الإنشاء والأمثلة التحليلية الشاملة v6.8...
                                                                                                                                --------------------------------------------------</div>
                                                                                                                                        <div class="row">
                                                                                                                                                    <textarea id="txt" placeholder="اكتب الرابط أو الهدف هنا..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();run();}"></textarea>
                                                                                                                                                                <button onclick="run()">تنفيذ</button>
                                                                                                                                                                        </div>
                                                                                                                                                                            </div>

                                                                                                                                                                                <script>
                                                                                                                                                                                        // قاعدة المعرفة الشاملة مع تواريخ التأسيس والأمثلة الدقيقة للإصدار v6.8
                                                                                                                                                                                                const knowledgeBase = {
                                                                                                                                                                                                            "google.com": { type: "شركة تقنية عملاقة / محرك بحث", founded: "4 سبتمبر 1998", example: "مثال: محرك البحث العالمي، نظام أندرويد، وخدمات السحابة الرقمية." },
                                                                                                                                                                                                                        "facebook.com": { type: "منصة تواصل اجتماعي", founded: "فبراير 2004", example: "مثال: حسابات الأفراد، الصفحات العامة، والمجموعات التفاعلية." },
                                                                                                                                                                                                                                    "instagram.com": { type: "منصة مرئية (تابعة لـ Meta)", founded: "6 أكتوبر 2010", example: "مثال: مشاركة الصور، القصص (Stories)، ومقاطع الريلز." },
                                                                                                                                                                                                                                                "github.com": { type: "منصة تطوير وسائط وبرمجيات", founded: "8 فبراير 2008", example: "مثال: استضافة المستودعات، إدارة الأكواد، ورفع صفحة الـ GitHub Pages." },
                                                                                                                                                                                                                                                            "twitter.com": { type: "منصة إعلام اجتماعي (X)", founded: "21 مارس 2006", example: "مثال: التغريدات المصغرة، الأخبار العاجلة، والمتابعة الحية." },
                                                                                                                                                                                                                                                                        "x.com": { type: "منصة إعلام اجتماعي (X)", founded: "21 مارس 2006", example: "مثال: التغريدات المصغرة، الأخبار العاجلة، والمتابعة الحية." },
                                                                                                                                                                                                                                                                                    "wikipedia.org": { type: "موسوعة معرفية حرة", founded: "15 يناير 2001", example: "مثال: توثيق المعلومات العامة، السير الذاتية، والأحداث التاريخية." }
                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                    async function run() {
                                                                                                                                                                                                                                                                                                                let t = document.getElementById('txt');
                                                                                                                                                                                                                                                                                                                            let l = document.getElementById('log');
                                                                                                                                                                                                                                                                                                                                        let q = t.value.trim();
                                                                                                                                                                                                                                                                                                                                                    if (!q) return;

                                                                                                                                                                                                                                                                                                                                                                l.innerHTML += `\n<span class='user'>[المستخدم] >> ${q}</span>\n`;
                                                                                                                                                                                                                                                                                                                                                                            t.value = "";
                                                                                                                                                                                                                                                                                                                                                                                        l.scrollTop = l.scrollHeight;

                                                                                                                                                                                                                                                                                                                                                                                                    let lower = q.toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                                let isScan = lower.includes('scan') || lower.includes('فحص') || lower.includes('.com') || lower.includes('.org') || lower.includes('.net') || lower.includes('http');

                                                                                                                                                                                                                                                                                                                                                                                                                            if (!isScan) {
                                                                                                                                                                                                                                                                                                                                                                                                                                            let reply = "أهلاً بك يا محمد. النظام يعمل بكفاءة وجاهز لخدمتك في أي استفسار أو عملية برمجية.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (lower.includes('اسم') || lower.includes('مين') || lower.includes('من أنت') || lower.includes('تعرفني')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                reply = "أنت محمد أبو منديل، المطور وصاحب النظام، من الأردن.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else if (lower.includes('كيف') || lower.includes('الحال') || lower.includes('شو اخبارك')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    reply = "الحمد لله يا محمد، كافة الأنظمة والأكواد تعمل بسلاسة تامة معك.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else if (lower.includes('مساعدة') || lower.includes('شغل') || lower.includes('أوامر')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        reply = "يمكنك كتابة أمر فحص مباشر مثل: (google.com) أو إدخال أي رابط لتحليل تاريخ التأسيس والنوع والأمثلة.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class='ai'>[الذكاء الاصطناعي]</span> ${reply}\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.innerHTML += `<span class='ai'>[1. التخطيط والاستطلاع]</span> تحليل الكيان واستخراج تاريخ التأسيس والأمثلة...\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await new Promise(r => setTimeout(r, 400));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // تحليل روابط التواصل الاجتماعي المختصرة أو العامة
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (lower.includes('facebook.com') || lower.includes('fb.watch') || lower.includes('instagram.com') || lower.includes('t.me')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let entityType = "حساب شخصي (فرد)";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let foundedDate = "يعتمد على تاريخ إنتاج/تفعيل الحساب الشخصي";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let practicalExample = "مثال: حساب فردي مخصص للتواصل الشخصي أو النشر العام.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (lower.includes('pages') || lower.includes('business') || lower.includes('group')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    entityType = "صفحة عامة / مؤسسة تجارية أو مجتمع";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        practicalExample = "مثال: صفحة أعمال رسمية، مجتمع تفاعلي، أو نشاط تجاري.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class='ok'>[✔ تحليلات المنصة الاجتماعية]</span>\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       ` - نوع الكيان: ${entityType}\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ` - تاريخ الإنشاء: <span class='info'>${foundedDate}</span>\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ` - مثال تحليلي: ${practicalExample}\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `<span class='ok'>[2. المراجعة] تمت عملية الاستعلام بنجاح دقيق.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let match = q.match(/(?:https?:\/\/)?(?:www\.)?([a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+)/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let domain = match ? match[1] : "google.com";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let kbInfo = knowledgeBase[domain];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let res = await fetch(`https://dns.google/resolve?name=${domain}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let data = await res.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (data.Answer && data.Answer.length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let ip = data.Answer.find(x => x.type === 1)?.data || data.Answer[0].data;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let geoRes = await fetch(`http://ip-api.com/json/${ip}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let geo = await geoRes.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.innerHTML += `<span class='ok'>[✔ تم فحص النطاق بنجاح]</span>\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   ` - الهدف: ${domain}\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ` - التحديد القاطع: ${kbInfo ? kbInfo.type : "موقع / كيان تقني أو مؤسسي"}\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ` - تاريخ التأسيس: <span class='info'>${kbInfo ? kbInfo.founded : "سجلات النطاق العامة (تأسيس رقمي نشط)"}</span>\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ` - أمثلة توضيحية: ${kbInfo ? kbInfo.example : "مثال: موقع إلكتروني رسمي يقدم خدمات أو محتوى رقمي للعامة."}\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               ` - عنوان IP: ${ip}\n`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   if (geo.status === "success") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           l.innerHTML += ` - الموقع الجغرافي: ${geo.country} (${geo.city})\n - المزود الشبكي: ${geo.isp}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   l.innerHTML += `<span class='ok'>[2. المراجعة الذاتية] اكتمل الاستطلاع دون أخطاء.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       l.innerHTML += `<span class='err'>[!] لم يتم العثور على سجلات نشطة لهذا النطاق.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   l.innerHTML += `<span class='err'>[!] خطأ في الاتصال بالبنية التحتية الشبكية.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </html>
