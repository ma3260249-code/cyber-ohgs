<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cyber OHGS Agent v7.2</title>
                <style>
                        body { background: #030712; color: #38bdf8; font-family: monospace; padding: 10px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                                .box { width: 100%; max-width: 650px; background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; }
                                        .console { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; text-align: right; }
                                                .row { display: flex; gap: 8px; }
                                                        textarea { flex: 1; padding: 10px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 6px; font-size: 13px; height: 40px; resize: none; direction: ltr; text-align: left; }
                                                                button { padding: 0 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
                                                                        .ai { color: #c084fc; font-weight: bold; }
                                                                                .user { color: #38bdf8; font-weight: bold; }
                                                                                        .ok { color: #4ade80; }
                                                                                                .err { color: #f43f5e; }
                                                                                                        .info { color: #facc15; }
                                                                                                            </style>
                                                                                                            </head>
                                                                                                            <body>
                                                                                                                <div class="box">
                                                                                                                        <div style="margin-bottom: 8px; font-size: 13px; color: #c084fc;"><b>Cyber OHGS - Conversational v7.2</b></div>
                                                                                                                                <div id="log" class="console"><span class='ai'>[ النظام جاهز ]</span> أهلاً يا محمد، تفضل بالحديث أو إرسال ما تحب...
                                                                                                                                --------------------------------------------------</div>
                                                                                                                                        <div class="row">
                                                                                                                                                    <textarea id="txt" placeholder="اكتب أي شيء هنا..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();run();}"></textarea>
                                                                                                                                                                <button onclick="run()">إرسال</button>
                                                                                                                                                                        </div>
                                                                                                                                                                            </div>

                                                                                                                                                                                <script>
                                                                                                                                                                                        const knowledgeBase = {
                                                                                                                                                                                                    "google.com": { type: "شركة تقنية عملاقة / محرك بحث", founded: "4 سبتمبر 1998", example: "مثال: محرك البحث العالمي، نظام أندرويد، وخدمات السحابة الرقمية." },
                                                                                                                                                                                                                "facebook.com": { type: "منصة تواصل اجتماعي", founded: "فبراير 2004", example: "مثال: حسابات الأفراد، الصفحات العامة، والمجموعات التفاعلية." },
                                                                                                                                                                                                                            "instagram.com": { type: "منصة مرئية (تابعة لـ Meta)", founded: "6 أكتوبر 2010", example: "مثال: مشاركة الصور، القصص (Stories)، ومقاطع الريلز." },
                                                                                                                                                                                                                                        "github.com": { type: "منصة تطوير وسائط وبرمجيات", founded: "8 فبراير 2008", example: "مثال: استضافة المستودعات، إدارة الأكواد، ورفع صفحة الـ GitHub Pages." },
                                                                                                                                                                                                                                                    "twitter.com": { type: "منصة إعلام اجتماعي (X)", founded: "21 مارس 2006", example: "مثال: التغريدات المصغرة، الأخبار العاجلة، والمتابعة الحية." },
                                                                                                                                                                                                                                                                "x.com": { type: "منصة إعلام اجتماعي (X)", founded: "21 مارس 2006", example: "مثال: التغريدات المصغرة، الأخبار العاجلة، والمتابعة الحية." },
                                                                                                                                                                                                                                                                            "wikipedia.org": { type: "موسوعة معرفية حرة", founded: "15 يناير 2001", example: "مثال: توثيق المعلومات العامة، السير الذاتية، والأحداث التاريخية." }
                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                            async function run() {
                                                                                                                                                                                                                                                                                                        let t = document.getElementById('txt');
                                                                                                                                                                                                                                                                                                                    let l = document.getElementById('log');
                                                                                                                                                                                                                                                                                                                                let q = t.value.trim();
                                                                                                                                                                                                                                                                                                                                            if (!q) return;

                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `\n<span class='user'>[محمد] >> ${q}</span>\n`;
                                                                                                                                                                                                                                                                                                                                                                    t.value = "";
                                                                                                                                                                                                                                                                                                                                                                                l.scrollTop = l.scrollHeight;

                                                                                                                                                                                                                                                                                                                                                                                            let lower = q.toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                        let isScan = lower.includes('http') || lower.includes('.com') || lower.includes('.org') || lower.includes('.net') || lower.includes('.jo');

                                                                                                                                                                                                                                                                                                                                                                                                                    // إذا لم يكن رابط فحص، يتم الرد على أي كلام أو جملة بشكل حر ومباشر
                                                                                                                                                                                                                                                                                                                                                                                                                                if (!isScan) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                let reply = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (lower.includes('مرحبا') || lower.includes('هلا') || lower.includes('السلام')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    reply = "هلا";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else if (lower.includes('كيفك') || lower.includes('شو اخبارك') || lower.includes('كيف حالك')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        reply = "الحمد لله كله تمام معك يا محمد.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else if (lower.includes('مين انت') || lower.includes('اسمك')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            reply = "أنا نظامك Cyber OHGS، معك على خط التعديل والمحادثة.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // رد حر ومتنوع لأي جملة أخرى يكتبها بدون تكرار مزعج
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let options = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `وصلتني عبارتك: "${q}". معك، تابع ماذا تريد أن نضيف أو نعدل؟`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `أعجبني ما تقوله عن "${q}". كيف ترغب أن نكمل؟`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `تمام يا محمد، استقبلت "${q}" بنجاح. أسمعك، تفضل.`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    reply = options[q.length % options.length];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.innerHTML += `<span class='ai'>[Cyber OHGS]</span> ${reply}\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // مسار فحص الروابط الأصلي
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        l.innerHTML += `<span class='ai'>[جاري الفحص]</span> تحليل النطاق واستخراج بيانات التأسيس...\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await new Promise(r => setTimeout(r, 300));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let match = q.match(/(?:https?:\/\/)?(?:www\.)?([a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+)/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let domain = match ? match[1] : "google.com";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let kbInfo = knowledgeBase[domain];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let res = await fetch(`https://dns.google/resolve?name=${domain}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let data = await res.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (data.Answer && data.Answer.length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let ip = data.Answer.find(x => x.type === 1)?.data || data.Answer[0].data;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let geoRes = await fetch(`http://ip-api.com/json/${ip}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let geo = await geoRes.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                l.innerHTML += `<span class='ok'>[نتيجة الفحص]</span>\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   ` - الهدف: ${domain}\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ` - التصنيف: ${kbInfo ? kbInfo.type : "موقع / منصة رقمية"}\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ` - تاريخ التأسيس: <span class='info'>${kbInfo ? kbInfo.founded : "متاح عبر السجلات النشطة"}</span>\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ` - أمثلة: ${kbInfo ? kbInfo.example : "مثال: منصة رقمية لتقديم الخدمات والمحتوى."}\n` +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               ` - IP: ${ip}\n`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   if (geo.status === "success") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           l.innerHTML += ` - الموقع: ${geo.country} (${geo.city})\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   l.innerHTML += `--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       l.innerHTML += `<span class='err'>[!] لا توجد سجلات نشطة لهذا النطاق.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   l.innerHTML += `<span class='err'>[!] خطأ في الاتصال بالشبكة.</span>\n--------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           l.scrollTop = l.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </html>
